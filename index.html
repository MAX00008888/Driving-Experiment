<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>SuRT Task</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    background: #f5f5f5;
    color: #111;
    overflow: hidden;
    touch-action: manipulation;
    -webkit-user-select: none;
    user-select: none;
  }

  #app {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
  }

  #toolbar {
    padding: 10px 12px;
    background: white;
    border-bottom: 1px solid #ccc;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
    z-index: 10;
  }

  #toolbar input, #toolbar button {
    font-size: 16px;
    padding: 8px 10px;
  }

  #status {
    margin-left: auto;
    font-size: 14px;
    white-space: nowrap;
  }

  #taskArea {
    position: relative;
    flex: 1;
    background: white;
    overflow: hidden;
  }

  .circle {
    position: absolute;
    border: 3px solid #111;
    border-radius: 50%;
    background: transparent;
    transform: translate(-50%, -50%);
    touch-action: manipulation;
  }

  .circle:active {
    background: #ddd;
  }

  #overlay {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(255,255,255,0.94);
    z-index: 20;
    text-align: center;
    padding: 24px;
  }

  #overlay.hidden { display: none; }

  #overlayBox {
    max-width: 680px;
  }

  #overlay h1 {
    margin-top: 0;
    font-size: 28px;
  }

  #overlay p {
    font-size: 18px;
    line-height: 1.5;
  }

  #summary {
    font-size: 16px;
    margin-top: 8px;
  }

  @media (max-width: 700px) {
    #toolbar {
      font-size: 14px;
    }
    #status {
      width: 100%;
      margin-left: 0;
    }
  }
</style>
</head>
<body>
<div id="app">
  <div id="toolbar">
    <label>
      Participant:
      <input id="participantId" type="text" value="P001" style="width:110px;">
    </label>

    <button id="startBtn">Start</button>
    <button id="stopBtn" disabled>Stop</button>
    <button id="exportBtn" disabled>Export CSV</button>

    <span id="status">Trials: 0 | Accuracy: -- | Mean RT: --</span>
  </div>

  <div id="taskArea">
    <div id="overlay">
      <div id="overlayBox">
        <h1>Surrogate Reference Task (SuRT)</h1>
        <p>
          Find and tap the <strong>larger circle</strong> as quickly and accurately as possible.
          A new display will appear after each response.
        </p>
        <p>Press <strong>Start</strong> when ready.</p>
      </div>
    </div>
  </div>
</div>

<script>
(() => {
  // =========================
  // CONFIGURATION
  // =========================
  const CONFIG = {
    distractorCount: 24,       // Typical range: 21–27
    distractorDiameterPx: 44,  // visual size on screen
    targetDiameterPx: 56,      // target is slightly larger
    edgeMarginPx: 38,
    minimumGapPx: 12,
    maxPlacementAttempts: 3000
  };

  const taskArea = document.getElementById("taskArea");
  const overlay = document.getElementById("overlay");
  const startBtn = document.getElementById("startBtn");
  const stopBtn = document.getElementById("stopBtn");
  const exportBtn = document.getElementById("exportBtn");
  const statusEl = document.getElementById("status");
  const participantIdEl = document.getElementById("participantId");

  let running = false;
  let trialNumber = 0;
  let trialStartTime = 0;
  let currentTargetIndex = null;
  let results = [];

  function nowMs() {
    return performance.now();
  }

function torontoTimestamp() {
    const d = new Date();

    const parts = new Intl.DateTimeFormat('en-CA', {
        timeZone: 'America/Toronto',
        year: 'numeric',
        month: '2-digit',
        day: '2-digit',
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit',
        hour12: false
    }).formatToParts(d);

    const obj = {};
    parts.forEach(p => obj[p.type] = p.value);

    const ms = String(d.getMilliseconds()).padStart(3, '0');

    return `${obj.year}-${obj.month}-${obj.day} ${obj.hour}:${obj.minute}:${obj.second}.${ms}`;
}
 
  function isoNow() {
    return new Date().toISOString();
  }

  function clearTask() {
    taskArea.querySelectorAll(".circle").forEach(el => el.remove());
  }

  function updateStatus() {
    if (results.length === 0) {
      statusEl.textContent = "Trials: 0 | Accuracy: -- | Mean RT: --";
      return;
    }

    const correct = results.filter(r => r.correct === 1);
    const accuracy = (correct.length / results.length) * 100;

    const validRTs = correct.map(r => r.rt_ms).filter(v => Number.isFinite(v));
    const meanRT = validRTs.length
      ? validRTs.reduce((a,b) => a+b, 0) / validRTs.length
      : NaN;

    statusEl.textContent =
      `Trials: ${results.length} | Accuracy: ${accuracy.toFixed(1)}% | Mean RT: ${
        Number.isFinite(meanRT) ? meanRT.toFixed(0) + " ms" : "--"
      }`;
  }

  function overlaps(candidate, placed) {
    for (const p of placed) {
      const dx = candidate.x - p.x;
      const dy = candidate.y - p.y;
      const dist = Math.sqrt(dx*dx + dy*dy);
      const minDist = candidate.r + p.r + CONFIG.minimumGapPx;
      if (dist < minDist) return true;
    }
    return false;
  }

  function generatePositions(count, width, height, radii) {
    const placed = [];

    for (let i = 0; i < count; i++) {
      const r = radii[i];
      let success = false;

      for (let attempt = 0; attempt < CONFIG.maxPlacementAttempts; attempt++) {
        const x = CONFIG.edgeMarginPx + r +
          Math.random() * Math.max(1, width - 2*(CONFIG.edgeMarginPx + r));

        const y = CONFIG.edgeMarginPx + r +
          Math.random() * Math.max(1, height - 2*(CONFIG.edgeMarginPx + r));

        const candidate = { x, y, r };

        if (!overlaps(candidate, placed)) {
          placed.push(candidate);
          success = true;
          break;
        }
      }

      if (!success) {
        // Fallback: allow looser placement if screen is very small
        placed.push({
          x: CONFIG.edgeMarginPx + r +
             Math.random() * Math.max(1, width - 2*(CONFIG.edgeMarginPx + r)),
          y: CONFIG.edgeMarginPx + r +
             Math.random() * Math.max(1, height - 2*(CONFIG.edgeMarginPx + r)),
          r
        });
      }
    }

    return placed;
  }

  function buildTrial() {
    if (!running) return;

    clearTask();
    trialNumber += 1;

    const total = CONFIG.distractorCount + 1;
    currentTargetIndex = Math.floor(Math.random() * total);

    const width = taskArea.clientWidth;
    const height = taskArea.clientHeight;

    const radii = Array(total).fill(CONFIG.distractorDiameterPx / 2);
    radii[currentTargetIndex] = CONFIG.targetDiameterPx / 2;

    const positions = generatePositions(total, width, height, radii);

    positions.forEach((pos, index) => {
      const el = document.createElement("div");
      el.className = "circle";
      el.dataset.index = index;
      el.dataset.isTarget = index === currentTargetIndex ? "1" : "0";

      const diameter = pos.r * 2;
      el.style.width = `${diameter}px`;
      el.style.height = `${diameter}px`;
      el.style.left = `${pos.x}px`;
      el.style.top = `${pos.y}px`;

      el.addEventListener("pointerdown", handleResponse, { passive: true });
      taskArea.appendChild(el);
    });

    trialStartTime = nowMs();
  }

  function handleResponse(event) {
    if (!running) return;

    const selected = event.currentTarget;
    const selectedIndex = Number(selected.dataset.index);
    const isTarget = selected.dataset.isTarget === "1";

    const rt = nowMs() - trialStartTime;

    const targetEl = taskArea.querySelector('[data-is-target="1"]');
    const targetRect = targetEl.getBoundingClientRect();
    const areaRect = taskArea.getBoundingClientRect();

    results.push({
      participant_id: participantIdEl.value.trim() || "unknown",
      trial: trialNumber,
      timestamp_iso: isoNow(),
      correct: isTarget ? 1 : 0,
      rt_ms: Math.round(rt),
      selected_index: selectedIndex,
      target_index: currentTargetIndex,
      target_x_px: Math.round(targetRect.left - areaRect.left + targetRect.width / 2),
      target_y_px: Math.round(targetRect.top - areaRect.top + targetRect.height / 2),
      screen_width_px: Math.round(taskArea.clientWidth),
      screen_height_px: Math.round(taskArea.clientHeight),
      distractor_count: CONFIG.distractorCount,
      distractor_diameter_px: CONFIG.distractorDiameterPx,
      target_diameter_px: CONFIG.targetDiameterPx
    });

    updateStatus();

    // Immediately show the next search display
    buildTrial();
  }

  function startTask() {
    results = [];
    trialNumber = 0;
    running = true;

    overlay.classList.add("hidden");
    startBtn.disabled = true;
    stopBtn.disabled = false;
    exportBtn.disabled = true;
    participantIdEl.disabled = true;

    updateStatus();
    buildTrial();
  }

  function stopTask() {
    running = false;
    clearTask();

    startBtn.disabled = false;
    stopBtn.disabled = true;
    exportBtn.disabled = results.length === 0;
    participantIdEl.disabled = false;

    const correct = results.filter(r => r.correct === 1);
    const acc = results.length ? (correct.length / results.length) * 100 : 0;
    const meanRT = correct.length
      ? correct.reduce((s,r) => s + r.rt_ms, 0) / correct.length
      : NaN;

    overlay.innerHTML = `
      <div id="overlayBox">
        <h1>Task Stopped</h1>
        <div id="summary">
          <p><strong>Responses:</strong> ${results.length}</p>
          <p><strong>Accuracy:</strong> ${acc.toFixed(1)}%</p>
          <p><strong>Mean correct RT:</strong> ${
            Number.isFinite(meanRT) ? meanRT.toFixed(0) + " ms" : "--"
          }</p>
          <p>You may export the trial-level data as CSV.</p>
        </div>
      </div>
    `;
    overlay.classList.remove("hidden");
  }

  function exportCSV() {
    if (results.length === 0) return;

    const headers = Object.keys(results[0]);
    const rows = results.map(row =>
      headers.map(h => {
        const v = String(row[h] ?? "");
        return `"${v.replace(/"/g, '""')}"`;
      }).join(",")
    );

    const csv = [headers.join(","), ...rows].join("\n");
    const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
    const url = URL.createObjectURL(blob);

    const a = document.createElement("a");
    const safeId = (participantIdEl.value.trim() || "participant")
      .replace(/[^a-zA-Z0-9_-]/g, "_");

    a.href = url;
    a.download = `SuRT_${safeId}_${new Date().toISOString().replace(/[:.]/g, "-")}.csv`;
    document.body.appendChild(a);
    a.click();
    a.remove();

    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  startBtn.addEventListener("click", startTask);
  stopBtn.addEventListener("click", stopTask);
  exportBtn.addEventListener("click", exportCSV);

  window.addEventListener("resize", () => {
    if (running) buildTrial();
  });

  document.addEventListener("contextmenu", e => e.preventDefault());
})();
</script>
</body>
</html>
